<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#f8f9fa" rx="10"/>
  <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Recursion Tree (Fibonacci F(4))</text>

  <!-- Level 0: F(4) -->
  <circle cx="300" cy="70" r="22" fill="#4a90d9" stroke="#333"/>
  <text x="300" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">F(4)</text>

  <!-- Level 1: F(3), F(2) -->
  <circle cx="180" cy="150" r="22" fill="#5cb85c" stroke="#333"/>
  <text x="180" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">F(3)</text>
  <circle cx="420" cy="150" r="22" fill="#5cb85c" stroke="#333"/>
  <text x="420" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">F(2)</text>

  <!-- Edges level 0->1 -->
  <line x1="285" y1="88" x2="195" y2="132" stroke="#333" stroke-width="1.5"/>
  <line x1="315" y1="88" x2="405" y2="132" stroke="#333" stroke-width="1.5"/>

  <!-- Level 2: F(2), F(1), F(1), F(0) -->
  <circle cx="100" cy="230" r="20" fill="#f0ad4e" stroke="#333"/>
  <text x="100" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">F(2)</text>
  <circle cx="260" cy="230" r="20" fill="#e74c3c" stroke="#333"/>
  <text x="260" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">F(1)</text>
  <circle cx="380" cy="230" r="20" fill="#e74c3c" stroke="#333"/>
  <text x="380" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">F(1)</text>
  <circle cx="500" cy="230" r="20" fill="#9b59b6" stroke="#333"/>
  <text x="500" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">F(0)</text>

  <!-- Edges level 1->2 -->
  <line x1="165" y1="168" x2="115" y2="212" stroke="#333" stroke-width="1.5"/>
  <line x1="195" y1="168" x2="245" y2="212" stroke="#333" stroke-width="1.5"/>
  <line x1="405" y1="168" x2="375" y2="212" stroke="#333" stroke-width="1.5"/>
  <line x1="435" y1="168" x2="485" y2="212" stroke="#333" stroke-width="1.5"/>

  <!-- Level 3: F(1), F(0) under F(2) -->
  <circle cx="60" cy="310" r="18" fill="#e74c3c" stroke="#333"/>
  <text x="60" y="315" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">F(1)</text>
  <circle cx="140" cy="310" r="18" fill="#9b59b6" stroke="#333"/>
  <text x="140" y="315" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">F(0)</text>

  <!-- Edges level 2->3 -->
  <line x1="85" y1="248" x2="65" y2="292" stroke="#333" stroke-width="1.5"/>
  <line x1="115" y1="248" x2="135" y2="292" stroke="#333" stroke-width="1.5"/>

  <!-- Legend -->
  <rect x="40" y="350" width="12" height="12" fill="#e74c3c"/>
  <text x="58" y="361" font-family="Arial" font-size="10" fill="#333">F(1)=1 (base)</text>
  <rect x="160" y="350" width="12" height="12" fill="#9b59b6"/>
  <text x="178" y="361" font-family="Arial" font-size="10" fill="#333">F(0)=0 (base)</text>
  <rect x="290" y="350" width="12" height="12" fill="#4a90d9"/>
  <text x="308" y="361" font-family="Arial" font-size="10" fill="#333">Recursive call</text>

  <text x="300" y="385" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">Naive recursion recomputes F(2) twice → O(2ⁿ)</text>
</svg>