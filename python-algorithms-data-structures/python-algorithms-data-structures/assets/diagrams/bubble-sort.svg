<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#f8f9fa" rx="10"/>
  <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Bubble Sort</text>

  <!-- Pass 1 -->
  <text x="50" y="70" font-family="Arial" font-size="12" fill="#666">Pass 1:</text>
  <rect x="100" y="55" width="40" height="30" fill="#e74c3c" stroke="#333"/>
  <text x="120" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="white">5</text>
  <rect x="145" y="55" width="40" height="30" fill="#f0ad4e" stroke="#333"/>
  <text x="165" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="white">1</text>
  <rect x="190" y="55" width="40" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="210" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="white">4</text>
  <rect x="235" y="55" width="40" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="255" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="white">2</text>
  <rect x="280" y="55" width="40" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="300" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="white">8</text>
  <text x="340" y="75" font-family="Arial" font-size="11" fill="#d9534f">swap 5,1</text>

  <!-- Pass 2 -->
  <text x="50" y="120" font-family="Arial" font-size="12" fill="#666">Pass 2:</text>
  <rect x="100" y="105" width="40" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="120" y="125" text-anchor="middle" font-family="Arial" font-size="12" fill="white">1</text>
  <rect x="145" y="105" width="40" height="30" fill="#e74c3c" stroke="#333"/>
  <text x="165" y="125" text-anchor="middle" font-family="Arial" font-size="12" fill="white">5</text>
  <rect x="190" y="105" width="40" height="30" fill="#f0ad4e" stroke="#333"/>
  <text x="210" y="125" text-anchor="middle" font-family="Arial" font-size="12" fill="white">4</text>
  <rect x="235" y="105" width="40" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="255" y="125" text-anchor="middle" font-family="Arial" font-size="12" fill="white">2</text>
  <rect x="280" y="105" width="40" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="300" y="125" text-anchor="middle" font-family="Arial" font-size="12" fill="white">8</text>
  <text x="340" y="125" font-family="Arial" font-size="11" fill="#d9534f">swap 5,4</text>

  <!-- Pass 3 -->
  <text x="50" y="170" font-family="Arial" font-size="12" fill="#666">Pass 3:</text>
  <rect x="100" y="155" width="40" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="120" y="175" text-anchor="middle" font-family="Arial" font-size="12" fill="white">1</text>
  <rect x="145" y="155" width="40" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="165" y="175" text-anchor="middle" font-family="Arial" font-size="12" fill="white">4</text>
  <rect x="190" y="155" width="40" height="30" fill="#e74c3c" stroke="#333"/>
  <text x="210" y="175" text-anchor="middle" font-family="Arial" font-size="12" fill="white">5</text>
  <rect x="235" y="155" width="40" height="30" fill="#f0ad4e" stroke="#333"/>
  <text x="255" y="175" text-anchor="middle" font-family="Arial" font-size="12" fill="white">2</text>
  <rect x="280" y="155" width="40" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="300" y="175" text-anchor="middle" font-family="Arial" font-size="12" fill="white">8</text>
  <text x="340" y="175" font-family="Arial" font-size="11" fill="#d9534f">swap 5,2</text>

  <!-- Pass 4 -->
  <text x="50" y="220" font-family="Arial" font-size="12" fill="#666">Pass 4:</text>
  <rect x="100" y="205" width="40" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="120" y="225" text-anchor="middle" font-family="Arial" font-size="12" fill="white">1</text>
  <rect x="145" y="205" width="40" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="165" y="225" text-anchor="middle" font-family="Arial" font-size="12" fill="white">4</text>
  <rect x="190" y="205" width="40" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="210" y="225" text-anchor="middle" font-family="Arial" font-size="12" fill="white">2</text>
  <rect x="235" y="205" width="40" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="255" y="225" text-anchor="middle" font-family="Arial" font-size="12" fill="white">5</text>
  <rect x="280" y="205" width="40" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="300" y="225" text-anchor="middle" font-family="Arial" font-size="12" fill="white">8</text>
  <text x="340" y="225" font-family="Arial" font-size="11" fill="#5cb85c">sorted!</text>

  <!-- Legend -->
  <rect x="100" y="280" width="15" height="15" fill="#e74c3c"/>
  <text x="122" y="292" font-family="Arial" font-size="11" fill="#333">Comparing</text>
  <rect x="220" y="280" width="15" height="15" fill="#f0ad4e"/>
  <text x="242" y="292" font-family="Arial" font-size="11" fill="#333">Swapping</text>
  <rect x="330" y="280" width="15" height="15" fill="#5cb85c"/>
  <text x="352" y="292" font-family="Arial" font-size="11" fill="#333">Sorted</text>

  <text x="300" y="340" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">Larger elements "bubble" to the end</text>
  <text x="300" y="365" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">Compare adjacent pairs, swap if out of order</text>
</svg>