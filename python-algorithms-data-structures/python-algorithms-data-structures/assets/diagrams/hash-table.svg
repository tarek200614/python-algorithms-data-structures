<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#f8f9fa" rx="10"/>
  <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Hash Table with Separate Chaining</text>

  <!-- Bucket array -->
  <text x="50" y="80" font-family="Arial" font-size="12" fill="#666">Index</text>
  <text x="150" y="80" font-family="Arial" font-size="12" fill="#666">Bucket</text>

  <!-- Index 0 -->
  <rect x="40" y="90" width="60" height="30" fill="#4a90d9" stroke="#333"/>
  <text x="70" y="110" text-anchor="middle" font-family="Arial" font-size="12" fill="white">0</text>
  <rect x="100" y="90" width="80" height="30" fill="#e8e8e8" stroke="#333"/>
  <text x="140" y="110" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">null</text>

  <!-- Index 1 -->
  <rect x="40" y="130" width="60" height="30" fill="#4a90d9" stroke="#333"/>
  <text x="70" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="white">1</text>
  <rect x="100" y="130" width="80" height="30" fill="#e8e8e8" stroke="#333"/>
  <text x="140" y="150" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">→</text>
  <rect x="190" y="130" width="80" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="230" y="150" text-anchor="middle" font-family="Arial" font-size="11" fill="white">("age",30)</text>
  <text x="275" y="150" font-family="Arial" font-size="11" fill="#333">→</text>
  <rect x="290" y="130" width="80" height="30" fill="#5cb85c" stroke="#333"/>
  <text x="330" y="150" text-anchor="middle" font-family="Arial" font-size="11" fill="white">("name","Al")</text>

  <!-- Index 2 -->
  <rect x="40" y="170" width="60" height="30" fill="#4a90d9" stroke="#333"/>
  <text x="70" y="190" text-anchor="middle" font-family="Arial" font-size="12" fill="white">2</text>
  <rect x="100" y="170" width="80" height="30" fill="#e8e8e8" stroke="#333"/>
  <text x="140" y="190" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">null</text>

  <!-- Index 3 -->
  <rect x="40" y="210" width="60" height="30" fill="#4a90d9" stroke="#333"/>
  <text x="70" y="230" text-anchor="middle" font-family="Arial" font-size="12" fill="white">3</text>
  <rect x="100" y="210" width="80" height="30" fill="#e8e8e8" stroke="#333"/>
  <text x="140" y="230" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">→</text>
  <rect x="190" y="210" width="80" height="30" fill="#f0ad4e" stroke="#333"/>
  <text x="230" y="230" text-anchor="middle" font-family="Arial" font-size="11" fill="white">("city","LA")</text>

  <!-- Index 4 -->
  <rect x="40" y="250" width="60" height="30" fill="#4a90d9" stroke="#333"/>
  <text x="70" y="270" text-anchor="middle" font-family="Arial" font-size="12" fill="white">4</text>
  <rect x="100" y="250" width="80" height="30" fill="#e8e8e8" stroke="#333"/>
  <text x="140" y="270" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">null</text>

  <!-- Legend -->
  <rect x="40" y="320" width="15" height="15" fill="#4a90d9"/>
  <text x="62" y="332" font-family="Arial" font-size="11" fill="#333">Index</text>
  <rect x="120" y="320" width="15" height="15" fill="#5cb85c"/>
  <text x="142" y="332" font-family="Arial" font-size="11" fill="#333">Key-Value Node</text>
  <rect x="260" y="320" width="15" height="15" fill="#f0ad4e"/>
  <text x="282" y="332" font-family="Arial" font-size="11" fill="#333">Collision Node</text>

  <text x="300" y="370" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">hash(key) % capacity = bucket index</text>
</svg>