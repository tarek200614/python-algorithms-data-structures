<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" fill="none"/>
  <!-- Bars of different heights representing sorting -->
  <rect x="16" y="80" width="16" height="32" fill="#e74c3c" stroke="#333" stroke-width="2" rx="2"/>
  <rect x="40" y="56" width="16" height="56" fill="#f0ad4e" stroke="#333" stroke-width="2" rx="2"/>
  <rect x="64" y="32" width="16" height="80" fill="#5cb85c" stroke="#333" stroke-width="2" rx="2"/>
  <rect x="88" y="16" width="16" height="96" fill="#4a90d9" stroke="#333" stroke-width="2" rx="2"/>
  <!-- Arrow showing sort direction -->
  <line x1="16" y1="120" x2="104" y2="120" stroke="#333" stroke-width="2"/>
  <polygon points="104,120 98,115 98,125" fill="#333"/>
</svg>