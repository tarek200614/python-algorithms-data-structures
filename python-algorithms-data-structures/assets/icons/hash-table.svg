<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" fill="none"/>
  <!-- Bucket array -->
  <rect x="20" y="20" width="88" height="88" fill="none" stroke="#333" stroke-width="2" rx="4"/>
  <line x1="20" y1="42" x2="108" y2="42" stroke="#333" stroke-width="1.5"/>
  <line x1="20" y1="64" x2="108" y2="64" stroke="#333" stroke-width="1.5"/>
  <line x1="20" y1="86" x2="108" y2="86" stroke="#333" stroke-width="1.5"/>
  <line x1="64" y1="20" x2="64" y2="108" stroke="#333" stroke-width="1.5"/>
  <!-- Key-value cells -->
  <rect x="22" y="22" width="40" height="18" fill="#4a90d9" rx="2"/>
  <rect x="66" y="22" width="40" height="18" fill="#5cb85c" rx="2"/>
  <rect x="22" y="44" width="40" height="18" fill="#5cb85c" rx="2"/>
  <rect x="66" y="44" width="40" height="18" fill="#f0ad4e" rx="2"/>
  <rect x="22" y="66" width="40" height="18" fill="#f0ad4e" rx="2"/>
  <rect x="66" y="66" width="40" height="18" fill="#4a90d9" rx="2"/>
  <rect x="22" y="88" width="40" height="18" fill="#e74c3c" rx="2"/>
  <rect x="66" y="88" width="40" height="18" fill="#5cb85c" rx="2"/>
  <!-- Hash symbol -->
  <text x="64" y="125" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">#</text>
</svg>