<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#f8f9fa" rx="10"/>
  <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Depth-First Search (DFS)</text>

  <!-- Nodes -->
  <circle cx="300" cy="80" r="25" fill="#4a90d9" stroke="#333"/>
  <text x="300" y="85" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">A</text>

  <circle cx="180" cy="160" r="25" fill="#5cb85c" stroke="#333"/>
  <text x="180" y="165" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">B</text>
  <circle cx="420" cy="160" r="25" fill="#f0ad4e" stroke="#333"/>
  <text x="420" y="165" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">C</text>

  <circle cx="120" cy="260" r="25" fill="#9b59b6" stroke="#333"/>
  <text x="120" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">D</text>
  <circle cx="240" cy="260" r="25" fill="#e74c3c" stroke="#333"/>
  <text x="240" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">E</text>
  <circle cx="360" cy="260" r="25" fill="#1abc9c" stroke="#333"/>
  <text x="360" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">F</text>
  <circle cx="480" cy="260" r="25" fill="#34495e" stroke="#333"/>
  <text x="480" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">G</text>

  <!-- Edges -->
  <line x1="300" y1="105" x2="180" y2="135" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="105" x2="420" y2="135" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="185" x2="120" y2="235" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="185" x2="240" y2="235" stroke="#333" stroke-width="2"/>
  <line x1="420" y1="185" x2="360" y2="235" stroke="#333" stroke-width="2"/>
  <line x1="420" y1="185" x2="480" y2="235" stroke="#333" stroke-width="2"/>

  <!-- Order labels -->
  <text x="335" y="75" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">①</text>
  <text x="145" y="155" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">②</text>
  <text x="85" y="255" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">③</text>
  <text x="275" y="255" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">④</text>
  <text x="455" y="155" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">⑤</text>
  <text x="395" y="255" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">⑥</text>
  <text x="515" y="255" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">⑦</text>

  <text x="300" y="340" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">Visit order: A → B → D → E → C → F → G</text>
  <text x="300" y="365" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">Go deep first, then backtrack (Stack/Recursion)</text>
</svg>