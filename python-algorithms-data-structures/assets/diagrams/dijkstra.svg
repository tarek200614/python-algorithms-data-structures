<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#f8f9fa" rx="10"/>
  <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Dijkstra's Shortest Path</text>

  <!-- Nodes -->
  <circle cx="80" cy="200" r="25" fill="#4a90d9" stroke="#333"/>
  <text x="80" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">A</text>
  <text x="80" y="240" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">dist:0</text>

  <circle cx="220" cy="120" r="25" fill="#5cb85c" stroke="#333"/>
  <text x="220" y="125" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">B</text>
  <text x="220" y="100" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">dist:4</text>

  <circle cx="220" cy="280" r="25" fill="#5cb85c" stroke="#333"/>
  <text x="220" y="285" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">C</text>
  <text x="220" y="315" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">dist:2</text>

  <circle cx="380" cy="120" r="25" fill="#f0ad4e" stroke="#333"/>
  <text x="380" y="125" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">D</text>
  <text x="380" y="100" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">dist:5</text>

  <circle cx="380" cy="280" r="25" fill="#f0ad4e" stroke="#333"/>
  <text x="380" y="285" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">E</text>
  <text x="380" y="315" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">dist:6</text>

  <circle cx="520" cy="200" r="25" fill="#e74c3c" stroke="#333"/>
  <text x="520" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">F</text>
  <text x="520" y="240" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">dist:7</text>

  <!-- Edges with weights -->
  <line x1="105" y1="185" x2="195" y2="135" stroke="#333" stroke-width="2"/>
  <text x="140" y="150" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">4</text>
  <line x1="105" y1="215" x2="195" y2="265" stroke="#333" stroke-width="2"/>
  <text x="140" y="255" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">2</text>
  <line x1="220" y1="145" x2="220" y2="255" stroke="#333" stroke-width="2"/>
  <text x="235" y="205" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">1</text>
  <line x1="245" y1="120" x2="355" y2="120" stroke="#333" stroke-width="2"/>
  <text x="300" y="110" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">1</text>
  <line x1="245" y1="280" x2="355" y2="280" stroke="#333" stroke-width="2"/>
  <text x="300" y="275" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">4</text>
  <line x1="380" y1="145" x2="380" y2="255" stroke="#333" stroke-width="2"/>
  <text x="395" y="205" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">2</text>
  <line x1="405" y1="135" x2="495" y2="185" stroke="#333" stroke-width="2"/>
  <text x="460" y="150" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">2</text>
  <line x1="405" y1="265" x2="495" y2="215" stroke="#333" stroke-width="2"/>
  <text x="460" y="255" font-family="Arial" font-size="11" fill="#d9534f" font-weight="bold">1</text>

  <text x="300" y="370" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">Shortest path A→F: A → C → E → F (cost: 7)</text>
</svg>