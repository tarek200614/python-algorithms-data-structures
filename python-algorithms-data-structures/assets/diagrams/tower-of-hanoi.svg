<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#f8f9fa" rx="10"/>
  <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Tower of Hanoi (3 disks)</text>

  <!-- Base -->
  <rect x="50" y="340" width="500" height="10" fill="#8B4513" stroke="#333"/>

  <!-- Rod A (Source) -->
  <rect x="145" y="200" width="10" height="140" fill="#666"/>
  <text x="150" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">A</text>
  <!-- Disks on A -->
  <rect x="110" y="320" width="80" height="20" fill="#4a90d9" stroke="#333" rx="3"/>
  <text x="150" y="335" text-anchor="middle" font-family="Arial" font-size="11" fill="white">3</text>
  <rect x="120" y="300" width="60" height="20" fill="#5cb85c" stroke="#333" rx="3"/>
  <text x="150" y="315" text-anchor="middle" font-family="Arial" font-size="11" fill="white">2</text>
  <rect x="130" y="280" width="40" height="20" fill="#f0ad4e" stroke="#333" rx="3"/>
  <text x="150" y="295" text-anchor="middle" font-family="Arial" font-size="11" fill="white">1</text>

  <!-- Rod B (Auxiliary) -->
  <rect x="295" y="200" width="10" height="140" fill="#666"/>
  <text x="300" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">B</text>

  <!-- Rod C (Destination) -->
  <rect x="445" y="200" width="10" height="140" fill="#666"/>
  <text x="450" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">C</text>

  <!-- Arrow -->
  <line x1="180" y1="180" x2="420" y2="180" stroke="#d9534f" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="420,180 410,175 410,185" fill="#d9534f"/>
  <text x="300" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#d9534f">Move all disks from A to C</text>

  <!-- Rules -->
  <text x="300" y="100" text-anchor="middle" font-family="Arial" font-size="12" fill="#333" font-weight="bold">Rules:</text>
  <text x="300" y="120" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">1. Move one disk at a time</text>
  <text x="300" y="138" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">2. Only move the top disk</text>
  <text x="300" y="156" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">3. Never place a larger disk on a smaller one</text>

  <text x="300" y="395" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">Minimum moves: 2ⁿ - 1 = 7 (for n=3)</text>
</svg>